name: Update BRH Daily Rates

on:
  schedule:
    # 7:00 AM ET (11:00 UTC during EDT / 12:00 UTC during EST) - Monday through Saturday
    - cron: '0 11 * * 1-6'
    - cron: '0 12 * * 1-6'
    # 11:00 AM ET Re-check (15:00 UTC during EDT / 16:00 UTC during EST) - Monday through Saturday
    - cron: '0 15 * * 1-6'
    - cron: '0 16 * * 1-6'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAITIAN_DOLLAR_CONNECT != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run BRH rate scraper
        run: npm run fetch-rates

      - name: Sync to public folder
        run: |
          mkdir -p public
          cp htd-quote.json public/htd-quote.json

      - name: Commit and push changes
        id: commit_step
        run: |
          git config user.name "Honson Luma"
          git config user.email "legal@haitiandollar.com"
          git add htd-quote.json public/htd-quote.json
          if git diff --staged --quiet; then
            echo "No rate changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(rates): update BRH daily quotations"
            git pull origin main --rebase
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Post Daily Rate to X
        if: steps.commit_step.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run post-to-x

      - name: Deploy updated rates to Firebase Hosting
        if: (steps.commit_step.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && env.HAS_FIREBASE_SECRET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAITIAN_DOLLAR_CONNECT }}'
          channelId: live
          projectId: haitian-dollar-connect
