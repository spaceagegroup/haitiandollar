name: Update BRH Daily Rates

on:
  schedule:
    # Run every 30 minutes at off-peak minutes (:17, :47) from 11:00 UTC (7:17 AM EDT) to 15:00 UTC (11:47 AM EDT), Monday - Saturday
    # Off-peak minute intervals avoid GitHub Actions top-of-the-hour queue starvation and ensure reliable auto-retries
    - cron: '17,47 11-15 * * 1-6'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAITIAN_DOLLAR_CONNECT != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Capture previous rate before update
        id: prev
        run: |
          if [ -f htd-quote.json ]; then
            PREV_DATE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('htd-quote.json','utf8')).date || '')")
            PREV_REF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('htd-quote.json','utf8')).reference?.raw || '')")
            echo "prev_date=$PREV_DATE" >> $GITHUB_OUTPUT
            echo "prev_ref=$PREV_REF" >> $GITHUB_OUTPUT
          fi

      - name: Run BRH rate scraper
        run: npm run fetch-rates

      - name: Check if rates actually updated
        id: check
        run: |
          NEW_DATE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('htd-quote.json','utf8')).date || '')")
          NEW_REF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('htd-quote.json','utf8')).reference?.raw || '')")
          LAST_TWEETED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('htd-quote.json','utf8')).lastTweetedDate || '')")
          echo "new_date=$NEW_DATE" >> $GITHUB_OUTPUT
          echo "new_ref=$NEW_REF" >> $GITHUB_OUTPUT
          echo "last_tweeted=$LAST_TWEETED" >> $GITHUB_OUTPUT
          PREV_DATE="${{ steps.prev.outputs.prev_date }}"
          PREV_REF="${{ steps.prev.outputs.prev_ref }}"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Triggered via manual workflow dispatch."
            echo "status=changed" >> $GITHUB_OUTPUT
          elif [ "$PREV_DATE" != "$NEW_DATE" ] || [ "$PREV_REF" != "$NEW_REF" ] || [ "$LAST_TWEETED" != "$NEW_DATE" ]; then
            echo "Fresh rate, new date, or pending X post detected ($PREV_DATE/$PREV_REF -> $NEW_DATE/$NEW_REF, tweeted: $LAST_TWEETED)."
            echo "status=changed" >> $GITHUB_OUTPUT
          else
            echo "Rates and date unchanged and already tweeted ($PREV_DATE @ $PREV_REF)."
            echo "status=unchanged" >> $GITHUB_OUTPUT
          fi

      - name: Skip posting if rates unchanged
        if: steps.check.outputs.status == 'unchanged'
        run: |
          echo "Rates unchanged from previous run. Skipping X post, commit, and deploy."

      - name: Sync to public folder
        if: steps.check.outputs.status == 'changed'
        run: |
          mkdir -p public
          cp htd-quote.json public/htd-quote.json

      - name: Post Daily Rate to X
        if: steps.check.outputs.status == 'changed'
        continue-on-error: true
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run post-to-x

      - name: Commit and push changes
        id: commit_step
        if: steps.check.outputs.status == 'changed'
        run: |
          git config user.name "Honson Luma"
          git config user.email "legal@haitiandollar.com"
          git checkout -- package-lock.json 2>/dev/null || true
          git add htd-quote.json public/htd-quote.json
          if git diff --staged --quiet; then
            echo "No file changes detected."
          else
            git commit -m "chore(rates): update BRH daily quotations"
            git pull origin main --rebase --autostash
            git push origin main
          fi

      - name: Deploy updated rates to Firebase Hosting
        if: steps.check.outputs.status == 'changed' && env.HAS_FIREBASE_SECRET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAITIAN_DOLLAR_CONNECT }}'
          channelId: live
          projectId: haitian-dollar-connect
